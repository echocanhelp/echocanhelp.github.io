<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echopedia — Not Found</title>
<style>body{font-family:system-ui,sans-serif;padding:2rem;text-align:center}a{font-size:1.2rem;display:inline-block;margin-top:1rem;padding:.6rem 1.2rem;background:#1a5fb4;color:#fff;border-radius:8px;text-decoration:none}</style>
</head><body>
<p id="s">找不到頁面…</p>
<a id="l" href="/wiki-public/index.html">前往 Echopedia · Go to Echopedia</a>
<script>
(function(){
  var p = location.pathname;
  var link = document.getElementById('l');
  var target = '/wiki-public/';
  if (p.indexOf('/wiki-public/') === 0 && p.charAt(p.length-1) === '/') target = p.replace(/\/$/,'');
  var bust = target + (target.indexOf('?')>-1?'&':'?') + 'cb=' + Date.now();
  link.href = bust;
  var n = 0;
  try { n = parseInt(sessionStorage.getItem('ep-n') || '0', 10); } catch(e) {}
  if (n < 3) {
    try { sessionStorage.setItem('ep-n', String(n+1)); } catch(e) {}
    location.replace(bust);
  } else {
    document.getElementById('s').textContent = '點擊下方按鈕繼續 —— Tap the button to continue:';
  }
})();
</script>
</body></html>
