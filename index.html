<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echopedia — 台美人歷史協會</title>
<link rel="canonical" href="https://echocanhelp.github.io/wiki-public/">
<style>body{font-family:system-ui,sans-serif;padding:2rem;text-align:center}a{font-size:1.2rem;display:inline-block;margin-top:1rem;padding:.6rem 1.2rem;background:#1a5fb4;color:#fff;border-radius:8px;text-decoration:none}</style>
<noscript><meta http-equiv="refresh" content="0; url=/wiki-public/index.html?from=root"></noscript>
</head><body>
<p id="s">正在前往 Echopedia…</p>
<a id="l" href="/wiki-public/index.html?from=root">點擊前往 Echopedia · Continue to Echopedia</a>
<script>
(function(){
  var p = location.pathname;
  var link = document.getElementById('l');
  var target = '/wiki-public/';
  link.href = target + '?cb=' + Date.now();
  if (p.indexOf('/wiki-public') === 0) return;
  var n = 0;
  try { n = parseInt(sessionStorage.getItem('ep-n') || '0', 10); } catch(e) {}
  if (n < 3) {
    try { sessionStorage.setItem('ep-n', String(n+1)); } catch(e) {}
    location.replace(target + '?cb=' + Date.now());
  } else {
    document.getElementById('s').textContent = '點擊下方按鈕繼續（自動導向已停止）—— Tap the button to continue:';
  }
})();
</script>
</body></html>
